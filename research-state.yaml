how_to_orchestrate:
  - "Delegate through the t3-code MCP server: delegate_task with target {providerInstanceId: acpRegistry_devin, model: claude-opus-5-5-medium | claude-sonnet-5-5-medium}, mode async. Follow-ups to a finished child: t3_thread_send (mode auto) to its thread id. Completion wakes the thread; do not poll."
  - "Machine: 15 cores, 24 GB. Earlier thrash at 19 agents (a 7 GB fine-tune). Keep at most ~6 agents, each process under 3 GB, OMP_NUM_THREADS=2."
  - "Agents never commit and never run validation. The orchestrator's `git add -A` picks up agents' in-progress files; that is expected."
  - "Briefs: experiments/AGENT_BRIEF.md, _R2, _R3, _R5 (shared memory). Gate scripts: experiments/halves.py (dev), experiments/valgate.py (validation)."
  - "Before writing a research-log header, run `date`; earlier headers had to be corrected repeatedly."
