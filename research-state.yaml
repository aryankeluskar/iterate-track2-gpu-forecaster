  - "Agents never commit and never run validation. The orchestrator's `git add -A` picks up agents' in-progress files; that is expected."
  - "Briefs: experiments/AGENT_BRIEF.md, _R2, _R3, _R5 (shared memory). Gate scripts: experiments/halves.py (dev), experiments/valgate.py (validation)."
