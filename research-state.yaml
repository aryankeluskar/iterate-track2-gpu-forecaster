  - validation ranges rest on 3 week-clusters: call them rough ranges, not 90% intervals
  - stricter validation p-values: prov ~0.005, fm2 ~0.005, fragility 0.05-0.08, analog 0.13-0.16; only prov and fm2 clearly hold; analog and fragility stay on dev evidence (stated deviation from Amendment 2)
  - the 37 series are chosen as of 6 Nov (hindsight); point-in-time margin of mix over drift +0.033 vs +0.080 on the fixed set
  - headline validation number is optimistic (members kept on that period); the non-headline number is the clean one
  - analog leak found by the audit and fixed (<= 2.1e-5 in log on forecasts used; none possible at the scored origin); deletion test added
  - validation query 5 was committed 32 s after its result; its score 0.1967 was missing from the log (now recorded)
  - Exa calendar gain (prov with cal on, 0.283 vs 0.209 on dev) is in-sample on two events and OFF in the submission
  - long-run section gives ranges; no method beat no-change on any backtest
  - Sunday is one origin: on 50 dev origins the blend beat drift on 46 and was below last value on 2 (overlapping dates)
  - hypotheses and forecasters were written by LLM agents directed by an orchestrator and a human; the loop's steps are commands, choosing and writing an idea is not automated

