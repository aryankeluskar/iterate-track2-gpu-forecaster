how_to_orchestrate:
  - "Delegate through the t3-code MCP server: delegate_task with target {providerInstanceId: acpRegistry_devin, model: claude-opus-5-5-medium | claude-sonnet-5-5-medium}, mode async. Follow-ups to a finished child: t3_thread_send (mode auto) to its thread id. Completion wakes the thread; do not poll."
