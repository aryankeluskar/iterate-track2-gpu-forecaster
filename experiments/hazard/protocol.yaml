slug: hazard
method: hazard (src/gpuf/methods/hazard.py)
failure_mode: >
  52% of dev cells do not move (0% of last-value loss, but every method spends interval width on them:
  blend loses 0.037 of base loss there); 9% move by more than 5% and carry 61% of last-value loss
  (up 46%, down 15%). Hindsight bounds on the blend (0.182): knowing whether it moves 0.219, knowing
  the direction 0.226, both 0.262.
hypothesis: >
  A hurdle model that separates (1) P(no change), P(up), P(down) in h days from (2) the size of the move
  given that it happens can recover part of the 0.219 / 0.226 bounds, because move occurrence and
  direction are partly predictable from observable state (days since last change, recent change counts,
  volatility of the series and of its collector-class peers, the offer panel's p25/p75 around the median,
  n_providers and its change), while current methods use one pooled h-day change distribution with a
  binary "changed in last 3 days" state.
mechanism: >
  The scored value is a median over 3-17 offers; it moves only when an offer near the middle reprices or
  the panel changes. A tight panel (p25 and p75 equal to the median) needs several offers to move; a
  recent n_providers change or a burst of changes marks an active repricing episode. Stage 1 is a pooled
  multinomial classifier per horizon (logistic regression, then LightGBM), fit at refit origins on all
  rental_all daily_statistics series using pairs whose target date is on or before the origin. Stage 2 is
  the recency-weighted (hl 30) pooled distribution of non-zero h-day log changes by sign, collector x
  class, own samples mixed in with prior strength k (as in mix), optionally rescaled by the series'
  volatility state. q10/q50/q90 are read from the mixture P(down) G_down + P(0) delta_0 + P(up) G_up.
prediction: >
  Classifier: AUC move-vs-no-move 0.70-0.80 out of sample by origin and Brier/log-loss clearly below the
  collector x horizon base rate; up-vs-down AUC lower (0.55-0.65) because direction is the harder
  question. Forecast: beats drift by about +0.08 (similar to mix) and mix by +0.00 to +0.02, mostly from
  the no-change bucket (collapsing tails on idle cells) and h=1/h=3; blend with mix adds +0.005 to +0.015.
refuted_if: >
  Classifier AUC for move vs no move below 0.65 or log loss not better than the base rate (state is not
  predictive beyond climatology), or the hazard forecast does not beat mix and the blend with mix does
  not beat mix (90% interval of the paired difference includes zero or is negative) while the classifier
  is good, in which case the report locates where the conversion from probability to pinball loss fails.
split: dev only (origins per harness splits.DEV), score on rental_headline, train on rental_all, h in 1, 3, 7.
